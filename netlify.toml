# Netlify build for the Next.js frontend. The backend is a separate service (see README.md).
# Install is written out because the lockfile sits under frontend, which is the base directory.
[build]
  base = "frontend"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.20.0"
  NEXT_TELEMETRY_DISABLED = "1"

# Gives /findings/[id] a serverless function. Without it Netlify deploys the static
# output only and every route 404s. No version pin, Netlify updates it each build.
[[plugins]]
  package = "@netlify/plugin-nextjs"